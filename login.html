<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Focal</title>
    <meta name="description" content="Focal: the class board, remote and planner for Mr. Steers' math classes. Teacher-only.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400..700&display=swap">
    <link rel="stylesheet" href="css/signin.css?v=1">
    <meta name="theme-color" content="#0B2559">
</head>
<body>
    <main class="si">
        <img src="brand/logo.svg" alt="Focal logo">
        <h1>Sign in</h1>
        <p class="who">Focal · Teacher-only</p>
        <div class="line" aria-hidden="true"></div>
        <p>Sign in with Google to open the home screen.</p>
        <div class="acts">
            <button id="loginBtnPage" class="btn go" type="button">Sign In with Google</button>
            <a class="btn ghost" href="home.html">Back</a>
        </div>
        <p id="loginNote" class="note" role="status"></p>
    </main>
    <script type="module">
        import { wireSignIn } from "./js/signInButton.js?v=19";
        wireSignIn(document.getElementById("loginBtnPage"), document.getElementById("loginNote"));
    </script>
</body>
</html>
