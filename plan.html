<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan the Week | Anchor Board</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
    <script src="js/scheme.js?v=2"></script>
    <link rel="stylesheet" href="css/board.css?v=60">
    <link rel="stylesheet" href="css/console.css?v=68">
    <link rel="stylesheet" href="css/theme-rings.css?v=2">
    <link rel="stylesheet" href="css/planner.css?v=60">
    <link rel="stylesheet" href="css/plan.css?v=68">
    <link rel="stylesheet" href="css/skin.css?v=3">
    <link rel="stylesheet" href="css/topbar.css?v=2">
    <meta name="theme-color" content="#081B45">
    <!-- Fetch the big and late files right away, side by side with the page code (Nov 22: the page waited on them one after another). -->
    <link rel="modulepreload" href="data/standards.js?v=60">
    <link rel="modulepreload" href="js/boardStore.js?v=58">
    <link rel="modulepreload" href="js/firebase.js">
    <link rel="modulepreload" href="js/auth.js">
    <link rel="modulepreload" href="js/contentPack.js?v=5">
    <script type="module" src="js/caleraOnly.js?v=1"></script>
</head>
<body class="console page planner">
    <header class="cbar">
        <a class="cbrand" href="index.html"><img src="brand/logo.svg" alt=""><span><b>Anchor Board</b><small id="who">For teachers</small></span></a>
        <span class="live" id="status" role="status">Connecting…</span>
        <a class="btn ghost" href="index.html" style="text-decoration:none">Home</a>
    </header>
    <script src="js/topbar.js?v=2"></script>
    <main class="wp">
        <div class="wp-top">
            <h1>Plan the Week</h1>
            <span class="wp-pill" id="state">Loading…</span>
            <div class="wp-wk wp-g">
                <button id="prevWk" type="button" aria-label="Previous school week"><span data-icon="chevronLeft"></span></button>
                <b id="wkTitle">Loading…</b><small id="wkDates"></small>
                <button id="nextWk" type="button" aria-label="Next school week"><span data-icon="chevronRight"></span></button>
            </div>
        </div>
        <div class="pw-skel" id="skel" aria-hidden="true"><div></div><div></div><div></div></div>
        <div id="view" hidden>
            <p class="pw-built" id="builtNote" hidden>This week is already on the board. Changes here only update the plan.</p>
            <section class="wp-sent wp-g" id="sendCard" aria-live="polite" hidden></section>
            <div class="wp-days wp-g" id="days"></div>
            <div class="wp-cls" id="classes"></div>
        </div>
        <div class="wp-bar wp-g" id="bar" hidden>
            <div class="sum" id="barSum" aria-live="polite"></div>
            <button class="btn ghost" id="noteBtn" type="button"><span data-icon="edit"></span><span>Add a note</span></button>
            <button class="btn go" id="sendBtn" type="button"><span data-icon="send"></span><span>Send to Claude</span></button>
        </div>
    </main>
    <script type="module" src="js/plan.js?v=68"></script>
    <script type="module">import { mountPlanNav } from "./js/studentsNav.js?v=6"; mountPlanNav("plan.html");</script>
    <script src="js/offline.js?v=1" defer></script>
</body>
</html>
