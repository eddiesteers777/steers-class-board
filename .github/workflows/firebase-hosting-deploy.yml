name: Deploy to Firebase Hosting

# Every push to main:
#   1. deploys the site to anchorboard.web.app and steers-class-board.web.app
#      (firebase.json keeps README, QUEUE, DESIGN, firestore.rules, tools/ and
#      logs off the public site),
#   2. publishes firestore.rules, so the rules on the live database always
#      match main (no more publishing by hand in the console),
#   (before 1, offline.json is written: the files sw.js saves so the board opens with no wifi)
#   3. points the old focalboard.web.app address at anchorboard.web.app.
# GitHub Pages is not touched by this workflow.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g firebase-tools
      - name: List the files the board saves for offline use (sw.js reads offline.json)
        run: node tools/offline/make-list.mjs
      - name: Site
        run: firebase deploy --only hosting:anchorboard,hosting:steers-class-board --project steers-class-board
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Firestore rules
        run: firebase deploy --only firestore:rules --project steers-class-board
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Old focalboard address forwards to anchorboard
        continue-on-error: true
        run: firebase deploy --only hosting:focalboard --project steers-class-board
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
