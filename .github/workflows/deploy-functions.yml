name: Deploy functions

# Run by hand (Actions > Deploy functions > Run workflow). Deploys functions/ (readNames: Claude
# reads the name box on scanned papers). It is not part of every push because it needs the Blaze
# plan and the ANTHROPIC_API_KEY secret in Google Secret Manager first (see functions/index.js).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: functions
      - run: npm install -g firebase-tools
      - name: Functions
        run: firebase deploy --only functions --project steers-class-board --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
