name: Home preview pictures (temporary, branch only)
# Takes preview pictures of Home's Today and Absences cards for review. Remove before merging.
on:
  push:
    branches: [claude/home-date-absences]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 5000 &
          sleep 2
          TZ=America/Chicago node tools/attendance/homeday.test.mjs
          TZ=America/Chicago PLAYWRIGHT=$PWD/node_modules/playwright/index.js node tools/attendance/home-shots.mjs shots
          TZ=America/Chicago PLAYWRIGHT=$PWD/node_modules/playwright/index.js node tools/attendance/home-test.mjs shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-preview
          path: shots
      - name: Put the pictures on a throwaway branch (preview/home-date-absences)
        if: always()
        run: |
          cd shots
          git init -q -b preview && git config user.name "preview" && git config user.email "preview@users.noreply.github.com"
          git add -A && git commit -qm "Home preview pictures" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" preview:preview/home-date-absences
