<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board | Anchor Board</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <!-- Start the connections and the sign-in/database code at once, so they load alongside the board code (2026-11-21). -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
    <link rel="modulepreload" href="js/boardStore.js?v=59">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=Patrick+Hand&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="css/board.css?v=63">
    <link rel="stylesheet" href="css/console.css?v=64">
    <link rel="stylesheet" href="css/theme-rings.css?v=2">
    <link rel="stylesheet" href="css/steps.css?v=5">
    <link rel="stylesheet" href="css/boardnav.css?v=1">
    <link rel="stylesheet" href="css/games.css?v=80">
    <link rel="stylesheet" href="css/buddy.css?v=2">
    <link rel="stylesheet" href="css/wb.css?v=7">
    <link rel="stylesheet" href="css/panels.css?v=7">
    <link rel="stylesheet" href="css/look.css?v=9">
    <link rel="stylesheet" href="css/boardglass.css?v=3">
    <link rel="stylesheet" href="css/slides.css?v=2">
    <link rel="stylesheet" href="css/seats.css?v=6">
    <link rel="stylesheet" href="css/bellplan.css?v=7">
    <link rel="stylesheet" href="css/ytmusic.css?v=3">
    <link rel="stylesheet" href="css/find.css?v=1">
    <link rel="stylesheet" href="css/manip.css?v=16">
    <meta name="theme-color" content="#081B45">
</head>
<body class="console board">
    <header class="cbar">
        <a class="cbrand" href="index.html"><img src="brand/logo.svg" alt=""><span><b>Anchor Board</b><small id="who">For teachers</small></span></a>
        <label class="field"><span>Period</span><select id="periodSel" aria-label="Period"></select></label>
        <label class="field" id="weekField" hidden><span>Week</span><select id="weekSel" aria-label="Week"></select></label>
        <span class="live" id="status" role="status">Connecting…</span>
        <button class="btn" id="boardBtn" type="button">Board view</button>
        <details class="menu acct"><summary>Menu</summary><div class="pop"><a href="index.html">Home</a><a href="rosters.html">Rosters</a><a href="seats.html">Seating charts</a><button id="signOut" type="button">Sign out</button></div></details>
    </header>
    <div class="cbody">
        <nav class="rail" aria-label="Board controls">
            <p class="railh">Screens</p>
            <div class="seg scr" id="screens" role="group" aria-label="Screen"></div>
            <details class="menu fold" id="toolsMenu" open><summary>Panels <span class="count" id="toolCount"></span></summary><div class="toolchips" id="dock" role="group" aria-label="Tools"></div></details>
            <details class="menu fold" id="filesMenu"><summary>Files</summary><div class="files" id="files"></div></details>
        </nav>
        <main class="deck">
            <div class="wrap" id="wrap"><div id="stage"><div id="screenHost"></div><div id="toolLayer" class="toollayer"></div></div></div>
            <div class="flowbar">
                <div class="seg days" id="days" role="group" aria-label="Day"></div>
                <div class="flow"><button id="flowBack" type="button">Back</button><button id="flowNext" type="button">Next</button></div>
            </div>
        </main>
    </div>
    <button id="exit" type="button">Show controls</button>
    <script type="module">
        import { startApp } from "./js/boardApp.js?v=181";
        startApp({ mode: "board" });
    </script>
    <script src="js/offline.js?v=1" defer></script>
</body>
</html>
