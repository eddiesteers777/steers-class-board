<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch-up | Anchor Board</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
    <script src="js/scheme.js?v=2"></script>
    <link rel="stylesheet" href="css/board.css?v=60">
    <link rel="stylesheet" href="css/console.css?v=64">
    <link rel="stylesheet" href="css/theme-rings.css?v=2">
    <link rel="stylesheet" href="css/builder.css?v=64">
    <link rel="stylesheet" href="css/absences.css?v=2">
    <link rel="stylesheet" href="css/catchup.css?v=2">
    <link rel="stylesheet" href="css/skin.css?v=2">
    <meta name="theme-color" content="#081B45">
    <script type="module" src="js/caleraOnly.js?v=1"></script>
</head>
<body class="console page">
    <header class="cbar">
        <a class="cbrand" href="index.html"><img src="brand/logo.svg" alt=""><span><b>Anchor Board</b><small id="who">For teachers</small></span></a>
        <a class="btn ghost" href="index.html" style="text-decoration:none">Home</a>
    </header>
    <main class="cu" id="cu" aria-live="polite"><div class="cu-skel"></div></main>
    <script type="module">
        import { WEEKS as PUBLISHED, PERIODS } from "./data/weeks.js?v=62";
        import * as store from "./js/boardStore.js?v=58";
        import { watchPrivateWeeks } from "./js/weeksLive.js?v=58";
        import { mountCatchup } from "./js/catchupPage.js?v=4";
        import { printPapers } from "./js/weekPack.js?v=1";
        import { loadStdBank } from "./js/stdBank.js?v=2";
        import { copyVersion, poolFor } from "./js/acapAssign.js?v=4";
        import { localIso } from "./js/attendanceCore.js?v=1";
        const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
        const q = new URLSearchParams(location.search), per = (q.get("p") || "").slice(0, 20), key = (q.get("k") || "").replace(/[^a-z0-9-]/g, "").slice(0, 40);
        const user = await store.ready();
        if (!user) location.replace("login.html");
        else {
            document.getElementById("who").textContent = "Signed in as " + (user.name || "teacher");
            const host = document.getElementById("cu");
            if (!PERIODS.some((p) => p[0] === per) || !key) { host.textContent = ""; host.append(el("h1", null, "Catch-up"), el("p", "cu-lead", "Open a student from the Absences card on Home.")); const a = el("a", "btn ghost", "Back to Home"); a.href = "index.html"; host.appendChild(a); }
            else {
                const C = mountCatchup({ store, el, host, periods: PERIODS, weeks: PUBLISHED, per, key, today: localIso(), print: printPapers, bank: loadStdBank, copyVersion, poolFor,
                    save: (path, data) => store.rooms.save("teacher/" + store.rooms.uid() + "/" + path, data, true),
                    savePub: (path, data) => store.rooms.save("pub/" + store.rooms.uid() + "/" + path, data, true),
                    grade: (c) => ({ "7th": "7th grade", "8th": "8th grade", "8th-acc": "8th grade Accelerated" }[c] || "") });
                watchPrivateWeeks(store, PUBLISHED, (list) => C.setWeeks(list));
            }
        }
    </script>
</body>
</html>
