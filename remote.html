<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote — Calera Math — Steers</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&display=swap">
    <link rel="stylesheet" href="css/board.css?v=2">
    <meta name="theme-color" content="#081B45">
</head>
<body>
    <div class="top">
        <img src="brand/calera-seal.webp" alt="Calera Middle School seal">
        <div class="brand"><b>Steers Classroom Board</b><span id="who">Calera Middle School</span></div>
        <span class="status" id="status" role="status">Connecting…</span>
        <select id="weekSel" aria-label="Week" hidden></select>
        <a class="home" href="index.html">Home</a>
        <button class="plain" id="signOut" type="button">Sign out</button>
        <button class="pillbtn" id="boardBtn" type="button">Board view</button>
    </div>
    <div class="strip">
        <div class="seg klass" id="classes" role="group" aria-label="Class"></div>
        <div class="seg" id="days" role="group" aria-label="Day"></div>
        <div class="seg scr" id="screens" role="group" aria-label="Screen"></div>
        <div class="files" id="files"></div>
    </div>
    <div class="wrap" id="wrap"><div id="stage"></div></div>
    <button id="exit" type="button">Show controls</button>
    <script type="module">
        import { startApp } from "./js/boardApp.js?v=2";
        startApp({ mode: "remote" });
    </script>
</body>
</html>
